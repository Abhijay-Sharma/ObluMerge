{% extends "hrms/base.html" %}
{% block title %}Delete Component{% endblock %}
{% block page_title %}Delete Component{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-body">
    <p>Delete component <strong>{{ object.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'hrms:salarystructure_detail' object.structure.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
