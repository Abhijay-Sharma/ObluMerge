{% extends "hrms/base.html" %}
{% block title %}Delete Designation{% endblock %}
{% block page_title %}Delete Designation{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-body">
    <p>Delete designation <strong>{{ object.title }}</strong>? This can't be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'hrms:designation_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
