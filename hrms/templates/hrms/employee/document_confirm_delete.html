{% extends "hrms/base.html" %}
{% block title %}Delete Document{% endblock %}
{% block page_title %}Delete Document{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-body">
    <p>Delete document <strong>{{ object.get_document_type_display }}</strong> for {{ object.employee.full_name }}?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'hrms:employee_detail' object.employee.pk %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
