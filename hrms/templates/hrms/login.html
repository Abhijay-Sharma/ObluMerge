{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Oblu HRMS</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'hrms/css/style.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:var(--bg);">
  <div class="card shadow-sm" style="width:380px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="mark mx-auto" style="width:42px;height:42px;">HR</div>
        <h4 class="mt-3 mb-0">Oblu HRMS</h4>
        <p class="text-muted small mb-0">Sign in to continue</p>
      </div>

      {% if form.errors %}
        <div class="alert alert-danger py-2 small">Invalid username or password.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100 fw-semibold" style="background:var(--accent); color:#0c1524;">Sign in</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </div>
  </div>
</body>
</html>
