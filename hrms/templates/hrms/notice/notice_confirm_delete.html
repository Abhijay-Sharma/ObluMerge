{% extends "hrms/base.html" %}

{% block title %}Delete Notice — HRMS{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-3">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-danger text-white p-4">
          <h5 class="fw-bold mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Delete Notice</h5>
        </div>
        <div class="card-body p-4 text-center">
          <p class="mb-4">Are you sure you want to delete the notice <strong>"{{ object.title }}"</strong>?</p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
              <a href="{% url 'hrms:notice_list' %}" class="btn btn-light rounded-pill px-4">Cancel</a>
              <button type="submit" class="btn btn-danger rounded-pill px-4">Delete Notice</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
